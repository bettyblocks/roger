name: Elixir CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    name: Build and test
    runs-on: ubuntu-latest

    env:
      # RabbitMQ only lets the default `guest` user connect over loopback, and
      # the service container is reached over a published port, so the tests
      # authenticate as the dedicated user created below instead.
      RABBITMQ_USERNAME: roger
      RABBITMQ_PASSWORD: roger

    services:
      rabbitmq:
        image: rabbitmq:4.1-alpine
        env:
          RABBITMQ_DEFAULT_USER: roger
          RABBITMQ_DEFAULT_PASS: roger
        ports:
          - 5672:5672
        # The job's steps do not start until this reports healthy, so the suite
        # never races the broker's listeners coming up.
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_port_connectivity"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 30s

    steps:
    - uses: actions/checkout@v7
    - name: Set up Elixir
      uses: erlef/setup-beam@v1
      with:
        elixir-version: '1.16.3' # Define the elixir version [required]
        otp-version: '26.2' # Define the OTP version [required]
    - name: Restore dependencies cache
      uses: actions/cache@v6
      with:
        path: deps
        key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
        restore-keys: ${{ runner.os }}-mix-
    - name: Install dependencies
      run: mix deps.get
    - name: Run tests
      run: mix test
    - name: Run dialyzer
      run: mix dialyzer
