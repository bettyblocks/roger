name: Elixir CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    name: Build and test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up Elixir
      uses: erlef/setup-beam@v1
      with:
        elixir-version: '1.16.3' # Define the elixir version [required]
        otp-version: '26.2' # Define the OTP version [required]
    - name: Set up rabbitmq
      uses: getong/rabbitmq-action@v1.2
      with:
        rabbitmq version: '4.1-management-alpine'
        host port: 5672
        rabbitmq user: 'guest'
        rabbitmq password: 'guest'
    - name: Restore dependencies cache
      uses: actions/cache@v6
      with:
        path: deps
        key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
        restore-keys: ${{ runner.os }}-mix-
    - name: Install dependencies
      run: mix deps.get
    - name: Run tests
      run: mix test
    - name: Run dialyzer
      run: mix dialyzer
